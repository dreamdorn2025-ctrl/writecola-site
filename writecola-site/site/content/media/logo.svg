<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2032"/>
      <stop offset="50%" stop-color="#12141f"/>
      <stop offset="100%" stop-color="#090a10"/>
    </linearGradient>

    <!-- Rich Gold / Amber Metallic Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a3"/>
      <stop offset="35%" stop-color="#f5cf73"/>
      <stop offset="70%" stop-color="#d49b29"/>
      <stop offset="100%" stop-color="#91620e"/>
    </linearGradient>

    <!-- Warm Copper Accent -->
    <linearGradient id="copperAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e57368"/>
      <stop offset="100%" stop-color="#f5cf73"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#logoBgGrad)" stroke="rgba(245, 207, 115, 0.3)" stroke-width="1.5"/>

  <!-- Subtle Inner Ring -->
  <rect x="10" y="10" width="100" height="100" rx="22" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>

  <!-- Ambient Light Reflection Behind Pen -->
  <circle cx="60" cy="56" r="32" fill="#d49b29" opacity="0.15" filter="url(#logoGlow)"/>

  <!-- Stylized Monogram / Fountain Pen Nib forming "W" -->
  <g transform="translate(60, 58)">
    
    <!-- Left Wing of W / Nib Shoulder Left -->
    <path d="M-36,-20 C-34,-4 -28,14 -16,28 L-16,8 C-24,-4 -28,-14 -36,-20 Z" fill="url(#goldMetallic)" opacity="0.85"/>
    
    <!-- Right Wing of W / Nib Shoulder Right -->
    <path d="M36,-20 C34,-4 28,14 16,28 L16,8 C24,-4 28,-14 36,-20 Z" fill="url(#goldMetallic)" opacity="0.85"/>

    <!-- Central Fountain Pen Nib Body -->
    <path d="M-22,-24 C-10,-28 10,-28 22,-24 C20,-2 14,18 0,36 C-14,18 -20,-2 -22,-24 Z" fill="url(#goldMetallic)" filter="url(#logoGlow)"/>

    <!-- Center Inlaid Dark Detail (Breather Hole & Slit) -->
    <!-- Breather Heart/Diamond Hole (Git Root Node) -->
    <circle cx="0" cy="-6" r="4.5" fill="#0c0e16" stroke="url(#goldMetallic)" stroke-width="1.5"/>
    
    <!-- Slit Line down to Nib Tip -->
    <line x1="0" y1="-1.5" x2="0" y2="35" stroke="#0c0e16" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Git Branch lines spreading upward like quill barbs / story chapters -->
    <path d="M0,-10 C-8,-16 -12,-20 -14,-25" fill="none" stroke="#0c0e16" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M0,-10 C8,-16 12,-20 14,-25" fill="none" stroke="#0c0e16" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Sparkle / Star Node on Top -->
    <g transform="translate(0, -31)">
      <circle cx="0" cy="0" r="2.5" fill="#fff" filter="url(#logoGlow)"/>
      <path d="M0,-5 L0,5 M-5,0 L5,0" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
    </g>

    <!-- Nib Tip Golden Spark -->
    <circle cx="0" cy="36" r="2" fill="#fff" filter="url(#logoGlow)"/>
  </g>
</svg>
